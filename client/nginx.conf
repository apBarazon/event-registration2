server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness for the container healthcheck
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # React Router: any other path serves the SPA
  location / {
    try_files $uri /index.html;
  }
}
