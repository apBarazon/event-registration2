<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Registration</title>
    <style>
      :root { --paper: #f6f4ef; --card: #fffdf9; --ink: #1c1b18; --muted: #6c6a62; --line: #d8d4c8; --accent: #24493b; --danger: #9a2f2f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      h1, h2, h3, .brand { font-family: Georgia, 'Times New Roman', serif; font-weight: 600; line-height: 1.2; }
      h1 { font-size: 2rem; margin: 2rem 0 1.25rem; } h2 { font-size: 1.15rem; margin: 0 0 .25rem; } h3 { font-size: 1.2rem; margin: 2rem 0 .75rem; }
      a { color: var(--accent); }
      .wrap { max-width: 960px; margin: 0 auto; padding: 0 1.25rem 4rem; }

      nav { border-bottom: 1px solid var(--line); background: var(--card); }
      nav .wrap { display: flex; align-items: center; gap: 1.25rem; padding: .9rem 1.25rem; flex-wrap: wrap; }
      nav .brand { font-size: 1.15rem; margin-right: auto; color: var(--ink); text-decoration: none; }
      nav a { text-decoration: none; color: var(--ink); }
      nav a:hover { text-decoration: underline; }
      nav button { padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; }

      footer { border-top: 1px solid var(--line); background: var(--card); }
      footer .wrap { padding: 1rem 1.25rem; font-size: .85rem; color: var(--muted); }

      label { display: block; margin: .9rem 0; font-size: .9rem; color: var(--muted); }
      input { display: block; width: 100%; margin-top: .3rem; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: 2px; background: #fff; color: var(--ink); font: inherit; }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      form { max-width: 420px; }
      form.wide { max-width: 640px; }
      button { padding: .55rem 1.1rem; border: 1px solid var(--accent); border-radius: 2px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      button.ghost { background: transparent; color: var(--accent); }
      button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
      button.small { padding: .25rem .6rem; font-size: .85rem; }
      [role=alert] { color: var(--danger); } [role=status] { color: var(--accent); }
      .muted { color: var(--muted); font-size: .9rem; }
      .actions { display: flex; gap: .5rem; flex-wrap: wrap; }

      ul.grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
      ul.grid li { margin: 0; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; }
      .cover { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #e7e3d7; }
      .body { padding: 1rem; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
      .body .foot { margin-top: auto; padding-top: .75rem; display: flex; justify-content: space-between; align-items: center; }
      .bar { height: 3px; background: var(--line); } .bar span { display: block; height: 100%; background: var(--accent); }

      .tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; }
      .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: .5rem 0; }
      .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); font-size: .92rem; }
      th, td { text-align: left; padding: .6rem .75rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
      th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
      tfoot td { font-weight: 600; border-bottom: 0; }
      .panel { background: var(--card); border: 1px solid var(--line); padding: 1rem 1.25rem; margin: 1rem 0; }
      .reg { background: var(--card); border: 1px solid var(--line); padding: 1rem 1.25rem; margin: 0 0 1rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
