# Jenkins lives in its own compose file so the app pipeline never redeploys Jenkins.
#   cd infra/jenkins && docker compose up -d --build
services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root                  # lab only: lets Jenkins use the Docker socket
    ports:
      - "8080:8080"             # Jenkins UI
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci-network

volumes:
  jenkins_data:

networks:
  ci-network:
    name: ci-network
